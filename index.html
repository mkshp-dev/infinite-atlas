<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Infinite Atlas — procedural terrain</title>
    <meta
      name="description"
      content="An endless procedural world generated entirely in your browser. Pan, zoom and share any view."
    />
    <meta name="theme-color" content="#08161f" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="map" role="application" aria-label="Infinite procedural terrain map"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <aside class="panel" aria-label="World controls">
      <header class="panel-head">
        <p class="eyebrow">procedural atlas</p>
        <h1>Infinite Atlas</h1>
        <p class="tagline">A whole world, generated in your browser as you explore.</p>
      </header>

      <div class="seed-row">
        <label class="field" for="seed">
          <span class="field-label">seed</span>
          <input
            id="seed"
            type="text"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            placeholder="type a seed and press enter"
          />
        </label>
        <button id="new-seed" class="icon-btn" type="button" title="Generate a new world (R)" aria-label="Generate a new world">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 5.7" />
            <path d="M20 4v7h-7" />
          </svg>
        </button>
      </div>

      <dl class="stats">
        <div class="stat-wide">
          <dt>position</dt>
          <dd id="stat-pos">—</dd>
        </div>
        <div>
          <dt>zoom</dt>
          <dd id="stat-scale">—</dd>
        </div>
        <div>
          <dt>detail</dt>
          <dd id="stat-level">—</dd>
        </div>
        <div>
          <dt>fps</dt>
          <dd id="stat-fps">—</dd>
        </div>
      </dl>

      <div class="layers" role="group" aria-label="Map layers">
        <label>
          <input type="checkbox" id="opt-shading" checked />
          <span>relief</span>
        </label>
        <label>
          <input type="checkbox" id="opt-contours" checked />
          <span>contours</span>
        </label>
        <label>
          <input type="checkbox" id="opt-grain" checked />
          <span>grain</span>
        </label>
      </div>

      <footer class="panel-foot">
        <span id="status" class="status">warming up…</span>
        <span class="foot-actions">
          <button id="reset" class="text-btn" type="button" title="Return to the starting view (0)">reset</button>
          <button id="share" class="text-btn" type="button" title="Copy a link to this exact view">copy link</button>
        </span>
      </footer>
    </aside>

    <div class="scale" aria-hidden="true">
      <span id="scale-label" class="scale-label">—</span>
      <span id="scale-line" class="scale-line"></span>
    </div>

    <svg class="compass" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="23" r="16" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4" />
      <path d="M24 9 L27.4 25.4 L24 23.2 L20.6 25.4 Z" fill="currentColor" />
      <path d="M24 37 L20.6 25.4 L24 27.6 L27.4 25.4 Z" fill="currentColor" opacity="0.35" />
      <text x="24" y="47" text-anchor="middle" font-size="6.5" letter-spacing="1.5" fill="currentColor">N</text>
    </svg>

    <p class="hint">
      drag to pan · scroll to zoom · <kbd>WASD</kbd> move · <kbd>R</kbd> new world · <kbd>0</kbd> reset
    </p>

    <div id="flash" class="flash" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
